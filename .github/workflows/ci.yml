name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Pruebas en host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: make ci (tests con ASan/UBSan, -Werror y auditoria estricta)
        run: make ci

  kernel-boot:
    name: Compilar y arrancar (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make binutils grub-pc-bin grub-common xorriso mtools \
            qemu-system-x86 qemu-system-arm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Compilar (sin warnings: -Werror)
        run: make ARCH=${{ matrix.arch }} WERROR=1
      - name: Arranque en QEMU
        run: make ARCH=${{ matrix.arch }} boot-smoke
      - name: Arranque con varias CPU (qemu64 sin RDRAND, Nehalem, max) (solo x86_64)
        if: matrix.arch == 'x86_64'
        run: make ARCH=x86_64 cpu-matrix
      - name: Servicios aislados en ring 3 y pruebas de ring 3 (solo x86_64)
        if: matrix.arch == 'x86_64'
        run: make ARCH=x86_64 sbx-check
      - name: Consumo de CPU en reposo (solo x86_64)
        if: matrix.arch == 'x86_64'
        run: make ARCH=x86_64 idle-check
      - name: Panic con backtrace y vigilante (solo x86_64)
        if: matrix.arch == 'x86_64'
        run: make ARCH=x86_64 fault-check
