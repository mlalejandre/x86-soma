# SOMA_270_GRUB: menu de arranque de SOMA (memoria USB, UEFI o BIOS heredada).
# Multiboot 2 entrega a SOMA la pantalla que deja el firmware (UEFI GOP o VBE), el mapa de memoria y la tabla ACPI.
# Las cuatro entradas principales: ThinkPad T480s o PC x86 generico, cada uno "desde USB" (normal) o "desde RAM" (soma.ram=1:
# las fuentes pasan a memoria y los archivos de SOMA solo se guardan al apagar o con 'disco sync'; ver docs/PARCHE_269_RAM.md).
set timeout=5
set default=0
insmod all_video
insmod gfxterm
insmod test
# Pantalla del T480s: 1920x1080 (FHD) o 2560x1440 (WQHD). Si el modo pedido no existe, GRUB usa el mejor disponible.
# OJO: gfxpayload se fija DESPUES de "multiboot2", porque esa orden lo sobrescribe con lo que pide la cabecera del nucleo.

menuentry "SOMA - ThinkPad T480s (desde USB)" {
    multiboot2 /boot/soma.elf soma.maquina=t480s
    if [ -f /boot/firmware/iwlwifi-8265-36.ucode ]; then module2 /boot/firmware/iwlwifi-8265-36.ucode iwlwifi-8265-36.ucode; fi   # SOMA_175A: firmware WiFi
    set gfxpayload=2560x1440x32,1920x1080x32,1920x1080,auto
    boot
}
menuentry "SOMA - ThinkPad T480s (desde RAM)" {
    multiboot2 /boot/soma.elf soma.maquina=t480s soma.ram=1
    if [ -f /boot/firmware/iwlwifi-8265-36.ucode ]; then module2 /boot/firmware/iwlwifi-8265-36.ucode iwlwifi-8265-36.ucode; fi   # SOMA_175A: firmware WiFi
    set gfxpayload=2560x1440x32,1920x1080x32,1920x1080,auto
    boot
}
menuentry "SOMA - PC x86 generico (desde USB)" {
    multiboot2 /boot/soma.elf
    if [ -f /boot/firmware/iwlwifi-8265-36.ucode ]; then module2 /boot/firmware/iwlwifi-8265-36.ucode iwlwifi-8265-36.ucode; fi   # SOMA_175A: firmware WiFi
    set gfxpayload=2560x1440x32,1920x1080x32,1920x1080,auto
    boot
}
menuentry "SOMA - PC x86 generico (desde RAM)" {
    multiboot2 /boot/soma.elf soma.ram=1
    if [ -f /boot/firmware/iwlwifi-8265-36.ucode ]; then module2 /boot/firmware/iwlwifi-8265-36.ucode iwlwifi-8265-36.ucode; fi   # SOMA_175A: firmware WiFi
    set gfxpayload=2560x1440x32,1920x1080x32,1920x1080,auto
    boot
}

# Las variantes de siempre, para cuando algo no arranca: dentro de este submenu.
submenu "Opciones avanzadas (resolucion, modo seguro, teclado...)" {
    menuentry "SOMA - PC generico con teclado espanol (soma.teclado=es)" {
        multiboot2 /boot/soma.elf soma.teclado=es
        if [ -f /boot/firmware/iwlwifi-8265-36.ucode ]; then module2 /boot/firmware/iwlwifi-8265-36.ucode iwlwifi-8265-36.ucode; fi
        set gfxpayload=2560x1440x32,1920x1080x32,1920x1080,auto
        boot
    }
    menuentry "SOMA - PC generico con teclado ingles (US)" {
        # SOMA_228_ARRANQUE: el mismo SOMA, con la distribucion de teclado de EE. UU. (la del T480s es la espanola)
        multiboot2 /boot/soma.elf soma.teclado=us
        if [ -f /boot/firmware/iwlwifi-8265-36.ucode ]; then module2 /boot/firmware/iwlwifi-8265-36.ucode iwlwifi-8265-36.ucode; fi   # SOMA_175A: firmware WiFi
        set gfxpayload=2560x1440x32,1920x1080x32,1920x1080,auto
        boot
    }
    menuentry "SOMA - T480s (resolucion segura 1024x768)" {
        multiboot2 /boot/soma.elf soma.maquina=t480s
        if [ -f /boot/firmware/iwlwifi-8265-36.ucode ]; then module2 /boot/firmware/iwlwifi-8265-36.ucode iwlwifi-8265-36.ucode; fi   # SOMA_175A: firmware WiFi
        set gfxpayload=1024x768x32,1024x768,auto
        boot
    }
    menuentry "SOMA - T480s (resolucion nativa del firmware)" {
        multiboot2 /boot/soma.elf soma.maquina=t480s
        if [ -f /boot/firmware/iwlwifi-8265-36.ucode ]; then module2 /boot/firmware/iwlwifi-8265-36.ucode iwlwifi-8265-36.ucode; fi   # SOMA_175A: firmware WiFi
        set gfxpayload=keep
        boot
    }
    menuentry "SOMA - T480s (un solo nucleo: soma.smp=off)" {
        # SOMA_159_T480S: los demas nucleos se quedan apagados (si algo falla al despertarlos). soma.smp=N limita a N.
        multiboot2 /boot/soma.elf soma.maquina=t480s soma.smp=off
        if [ -f /boot/firmware/iwlwifi-8265-36.ucode ]; then module2 /boot/firmware/iwlwifi-8265-36.ucode iwlwifi-8265-36.ucode; fi   # SOMA_175A: firmware WiFi
        set gfxpayload=2560x1440x32,1920x1080x32,1920x1080,auto
        boot
    }
    menuentry "SOMA - T480s (modo seguro: sin drivers nuevos)" {
        # SOMA_156_T480S: "soma.seguro" apaga todo lo que tenga interruptor (soma.X=off). Usala si un parche nuevo no arranca.
        multiboot2 /boot/soma.elf soma.maquina=t480s soma.seguro
        if [ -f /boot/firmware/iwlwifi-8265-36.ucode ]; then module2 /boot/firmware/iwlwifi-8265-36.ucode iwlwifi-8265-36.ucode; fi   # SOMA_175A: firmware WiFi
        set gfxpayload=1920x1080x32,1024x768x32,auto
        boot
    }
}
